[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-kkux-enrollment-control"
version = "0.1.0"
description = "Open edX enforcement and trusted enrolment API for KKUx-managed course runs"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<6", "djangorestframework>=3.15,<4"]

[project.entry-points."lms.djangoapp"]
kkux_enrollment_control = "kkux_enrollment_control.apps:KkuxEnrollmentControlConfig"

[tool.setuptools.packages.find]
include = ["kkux_enrollment_control*"]
